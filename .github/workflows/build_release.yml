name: Build and Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bin qd-edge-ice

      - name: Rename Windows executable
        shell: pwsh
        run: |
          Copy-Item `
            "target/release/qd-edge-ice.exe" `
            "QD-Edge-ICE-Windows.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: qd-edge-ice-windows
          path: QD-Edge-ICE-Windows.exe


  # ============================================================
  # MACOS
  # ============================================================

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bin qd-edge-ice

      - name: Create macOS app bundle
        shell: bash
        run: |
          APP_DIR="QD Edge ICE.app"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp \
            target/release/qd-edge-ice \
            "$APP_DIR/Contents/MacOS/qd-edge-ice"

          cat > "$APP_DIR/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
              "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>QD Edge ICE</string>

              <key>CFBundleDisplayName</key>
              <string>QD Edge ICE</string>

              <key>CFBundleIdentifier</key>
              <string>uk.qdedgeice.desktop</string>

              <key>CFBundleVersion</key>
              <string>1.0.0</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleExecutable</key>
              <string>qd-edge-ice</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>

              <key>NSHighResolutionCapable</key>
              <true/>

              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF

          chmod +x "$APP_DIR/Contents/MacOS/qd-edge-ice"

      - name: Zip macOS app
        run: |
          zip -r "QD-Edge-ICE-macOS.zip" "QD Edge ICE.app"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: qd-edge-ice-macos
          path: QD-Edge-ICE-macOS.zip


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Build
        run: cargo build --release --bin qd-edge-ice

      # --------------------------------------------------------
      # Standalone Linux binary
      # --------------------------------------------------------

      - name: Package Linux binary
        run: |
          mkdir -p linux-package

          cp \
            target/release/qd-edge-ice \
            linux-package/qd-edge-ice

          chmod +x \
            linux-package/qd-edge-ice

          tar -czf \
            QD-Edge-ICE-Linux-x86_64.tar.gz \
            -C linux-package \
            qd-edge-ice

      # --------------------------------------------------------
      # AppImage
      # --------------------------------------------------------

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

      - name: Create AppImage structure
        run: |
          mkdir -p QDEdgeICE.AppDir/usr/bin
          mkdir -p QDEdgeICE.AppDir/usr/share/applications

          cp \
            target/release/qd-edge-ice \
            QDEdgeICE.AppDir/usr/bin/qd-edge-ice

          chmod +x \
            QDEdgeICE.AppDir/usr/bin/qd-edge-ice

          cat > QDEdgeICE.AppDir/qd-edge-ice.desktop <<'EOF'
          [Desktop Entry]
          Name=QD Edge ICE
          Comment=QD Edge ICE application
          Exec=qd-edge-ice
          Icon=qd-edge-ice
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          cp \
            QDEdgeICE.AppDir/qd-edge-ice.desktop \
            QDEdgeICE.AppDir/usr/share/applications/

          python3 - <<'PY'
          import struct
          import zlib

          width = height = 1
          raw = b'\x00\x00\x00\x00'

          def chunk(name, data):
              return (
                  struct.pack(">I", len(data))
                  + name
                  + data
                  + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff)
              )

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(
                  b'IHDR',
                  struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              )
              + chunk(b'IDAT', zlib.compress(raw))
              + chunk(b'IEND', b'')
          )

          with open(
              'QDEdgeICE.AppDir/qd-edge-ice.png',
              'wb'
          ) as f:
              f.write(png)
          PY

      - name: Build AppImage
        run: |
          ARCH=x86_64 \
            ./appimagetool \
            QDEdgeICE.AppDir \
            QD-Edge-ICE-Linux-x86_64.AppImage

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: qd-edge-ice-linux-binary
          path: QD-Edge-ICE-Linux-x86_64.tar.gz

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: qd-edge-ice-linux-appimage
          path: QD-Edge-ICE-Linux-x86_64.AppImage


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - windows
      - macos
      - linux

    # Only create a release when the workflow was triggered
    # by a version tag.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files

          find artifacts \
            -type f \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QD Edge ICE ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true
